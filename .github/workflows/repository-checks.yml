name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false
          persist-credentials: false
      - name: Validate branch and pull request title
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/validate-pr-policy.sh "$HEAD_BRANCH" "$PR_TITLE"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Contract checks inspect pointers and metadata, not large payloads.
          lfs: false
          persist-credentials: false
      - name: Validate repository contract
        run: ./scripts/validate-repository.sh

  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false
          persist-credentials: false
      - name: Parse Windows scripts
        shell: pwsh
        run: |
          $Failed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 | ForEach-Object {
            $ScriptFile = $_
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $ScriptFile.FullName,
              [ref]$Tokens,
              [ref]$Errors
            ) > $null

            foreach ($ParseError in $Errors) {
              Write-Error "$($ScriptFile.Name): $($ParseError.Message)"
              $Failed = $true
            }
          }

          if ($Failed) {
            throw "PowerShell syntax validation failed."
          }
