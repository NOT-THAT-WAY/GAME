name: Repository checks

# Un seul job, sur Ubuntu, volontairement.
#
# GitHub facture chaque job à la minute supérieure et applique un multiplicateur
# par plateforme : Ubuntu x1, Windows x2, macOS x10. Les contrôles statiques de ce
# dépôt durent ensemble moins d’une minute, mais découpés en plusieurs jobs
# dont un sous Windows ils coûtaient 4 minutes par pull request — 104 minutes
# facturées pour 14 minutes de calcul réel. Le gaspillage venait du découpage,
# pas du nombre de pull requests : les regrouper ramène le coût à 1 minute par
# exécution.
#
# Analyser du PowerShell ne demande pas Windows : `pwsh` est préinstallé sur les
# runners Ubuntu et le parseur est celui de PowerShell 7, indépendant de la
# plateforme. Le contrôle est identique pour la moitié du prix.
#
# À savoir avant de redécouper : un job ajouté coûte au moins une minute même
# s'il ne fait rien, et le budget de l'organisation est de 2 000 minutes par
# mois sur le plan Free.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Contract checks inspect pointers and metadata, not large payloads.
          lfs: false
          persist-credentials: false

      # Un push direct sur main n'a ni branche source ni titre de PR à valider.
      - name: Validate branch and pull request title
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: ./scripts/validate-pr-policy.sh "$HEAD_BRANCH" "$PR_TITLE" "$PR_AUTHOR"

      - name: Validate repository contract
        run: ./scripts/validate-repository.sh

      - name: Validate human smoke tooling
        run: ./tests/human-test/test-wrapper-contract.sh

      - name: Validate workflow tooling
        run: ./tests/workflow/test-policy-contract.sh

      - name: Validate Unity test wrappers
        run: ./tests/unity-tests/test-wrapper-contract.sh

      - name: Validate player build manifests
        run: ./tests/build-manifests/test-manifest-contract.sh

      - name: Validate evidence report contracts
        run: python3 ./tests/evidence/test-report.py

      - name: Validate redacted network report
        run: python3 ./tests/network-logs/test-report.py

      - name: Validate topology fixture contract
        run: python3 ./tests/topology-fixtures/test-fixtures.py

      - name: Parse Windows scripts
        shell: pwsh
        run: |
          $Failed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 | ForEach-Object {
            $ScriptFile = $_
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $ScriptFile.FullName,
              [ref]$Tokens,
              [ref]$Errors
            ) > $null

            foreach ($ParseError in $Errors) {
              Write-Error "$($ScriptFile.Name): $($ParseError.Message)"
              $Failed = $true
            }
          }

          if ($Failed) {
            throw "PowerShell syntax validation failed."
          }
